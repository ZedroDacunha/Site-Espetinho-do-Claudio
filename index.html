<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Espetinhos do Cláudio 🍖 </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Controle de estoque</h1>
        
        <form id="form-produto">
            <label for="nome">Nome do produto</label> 
            <input type="text" id="nome" required placeholder="Digite o nome do produto">
            <label for="preco">Valor do produto</label>
            <input type="number" id="preco" required min="0" step="0.01" placeholder="Digite o valor do produto">
            <label for="quantidade">Quantidade do produto</label>
            <input type="number" id="quantidade" required min="0" placeholder="Digite a quantidade de produtos">
            <button type="submit" id="Cadastrar">Cadastrar produto</button>
        </form>

        <button type="button" id="verlista">ver lista</button>

        <ul id="lista-produtos">

        </ul>

        <script src="script.js"></script>
    </body>
</html>
