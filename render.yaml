services:
  - type: web
    name: espetinhos-do-claudio
    runtime: node
    region: virginia
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix servidor
    startCommand: npm start --prefix servidor
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
